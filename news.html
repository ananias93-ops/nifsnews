var view=items.filter(function(i){if(!(i.orgs&sel))return false;if(titleOnly&&!(i.tm&sel))return false;if(q&&(i.title+" "+i.source).toLowerCase().indexOf(q)<0)return false;return true;});
var map={},list=[];view.forEach(function(i){var k=i.date+"|"+i.grp;if(i.grp.length>=8&&map[k]){map[k].dups.push(i);}else{i.dups=[];list.push(i);if(i.grp.length>=8)map[k]=i;}});
var feed=$("feed");if(!list.length){feed.innerHTML='<div class="empty">'+(items.length?"조건에 맞는 기사가 없습니다.":"수집된 기사가 없습니다.")+"</div>";return;}
var part=list.slice(0,shown),groups=[],cur=null;part.forEach(function(i){if(!cur||cur.date!==i.date){cur={date:i.date,rows:[]};groups.push(cur);}cur.rows.push(i);});
var h=groups.map(function(g){return'<section class="day"><h2><b>'+esc(g.date)+'</b>'+esc(dayLabel(g.date))+' · '+g.rows.length+'건</h2><div class="list">'+g.rows.map(row).join("")+"</div></section>";}).join("");
var left=list.length-part.length;if(left>0)h+='<button type="button" class="more" id="more">'+Math.min(PAGE,left)+'건 더 보기 (남은 '+left.toLocaleString()+'건)</button>';
feed.innerHTML=h;var mb=$("more");if(mb)mb.addEventListener("click",function(){shown+=PAGE;render();});}
document.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){sel=+b.dataset.k;shown=PAGE;try{localStorage.setItem("nwsel",sel);}catch(e){}render();});});
$("t").addEventListener("change",function(e){titleOnly=e.target.checked;shown=PAGE;try{localStorage.setItem("nwtitle",titleOnly?"1":"0");}catch(x){}render();});
var tmr;$("q").addEventListener("input",function(e){clearTimeout(tmr);tmr=setTimeout(function(){query=e.target.value;shown=PAGE;render();},150);});
render();})();
</script></body></html>
