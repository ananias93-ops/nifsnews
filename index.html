<style>
:root {

  --bg: #f3f5f6;

  --line: #dde3e7;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {

}

}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }

.wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 64px; display: grid; gap: 22px; }

header { display: grid; gap: 8px; }

.more:hover { border-color: var(--muted); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13.5px; border: 0; background: transparent; color: var(--muted); padding: 7px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg .n { font-family: var(--font-mono); font-size: 12px; opacity: .75; }
.search { flex: 1 1 200px; display: flex; }
.search input { width: 100%; font: inherit; font-size: 14px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

#feed { display: grid; gap: 20px; }
.day { display: grid; gap: 8px; }
.day h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 6px 0 0; display: flex; gap: 10px; align-items: baseline; }
.day h2 .d { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }
.list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.item { display: grid; grid-template-columns: 4px 1fr; }
.item + .item { border-top: 1px solid var(--line); }
.item .bar { background: var(--mof); }
.item.nifs .bar { background: var(--nifs); }
.item .body { padding: 12px 16px; display: grid; gap: 4px; min-width: 0; }
.item .title { font-size: 15.5px; font-weight: 500; line-height: 1.45; text-decoration: none; overflow-wrap: anywhere; }
.item .title:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); align-items: center; }
.src { font-weight: 600; color: var(--mof); }
.nifs .src { color: var(--nifs); }
.badge { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--new); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 2px; }
.file { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
footer a { color: var(--muted); }
@media (max-width: 480px) {
  h1 { font-size: 22px; }
  .wrap { padding: 20px 16px 48px; }
  .seg button { padding: 7px 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      return '<section class="day"><h2><span class="d">' + esc(g.date) + '</span><span>' + esc(dayLabel(g.date)) + '</span></h2><div class="list">' +
        g.rows.map(row).join("") + "</div></section>";
    }).join("");
    var left = view.length - part.length;
    if (left > 0) htmlStr += '<button type="button" class="more" id="more">' + Math.min(PAGE, left) + '건 더 보기 (남은 ' + left.toLocaleString() + '건)</button>';
    feed.innerHTML = htmlStr;
    var mb = $("more"); if (mb) mb.addEventListener("click", function () { shown += PAGE; render(); });
  }
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () { filter = b.dataset.f; shown = PAGE; try { localStorage.setItem("prfilter", filter); } catch (e) {} render(); });
  });
  var tmr; $("q").addEventListener("input", function (e) { clearTimeout(tmr); tmr = setTimeout(function () { query = e.target.value; shown = PAGE; render(); }, 150); });
  render();
})();
</script>
</body>
</html>
